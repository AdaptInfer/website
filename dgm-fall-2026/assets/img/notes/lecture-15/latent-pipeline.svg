<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-label="Latent diffusion training and generation">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52657a" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="490" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c42;font-size:21px}.small{font-size:17px;fill:#52657a}.box{fill:#eef4fa;stroke:#8da9c4;stroke-width:1.5}.line{stroke:#52657a;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="25" y="37" font-weight="bold">TRAINING: construct noisy latent inputs</text>
<rect class="box" x="25" y="65" width="130" height="70" rx="8"/><text x="90" y="107" text-anchor="middle">Image x</text>
<path class="line" d="M155 100 H208"/>
<rect class="box" x="215" y="65" width="150" height="70" rx="8"/><text x="290" y="107" text-anchor="middle">Encoder E</text>
<path class="line" d="M365 100 H418"/>
<rect class="box" x="425" y="65" width="170" height="70" rx="8"/><text x="510" y="107" text-anchor="middle">Clean latent z₀</text>
<path class="line" d="M595 100 H648"/>
<rect class="box" x="655" y="65" width="150" height="70" rx="8"/><text x="730" y="107" text-anchor="middle">Add noise</text>
<path class="line" d="M805 100 H858"/>
<rect class="box" x="865" y="65" width="150" height="70" rx="8"/><text x="940" y="107" text-anchor="middle">Noisy zₜ</text>
<text class="small" x="25" y="169">The denoiser learns to predict the known noise at a sampled timestep.</text>
<path d="M25 194 H1015" stroke="#d6e0e9"/>
<text x="25" y="232" font-weight="bold">GENERATION: sample a new image</text>
<rect class="box" x="25" y="330" width="170" height="80" rx="8"/><text x="110" y="364" text-anchor="middle">Gaussian noise</text><text x="110" y="391" text-anchor="middle">zT</text>
<path class="line" d="M195 370 H243"/>
<rect x="250" y="330" width="235" height="80" rx="8" fill="#e4f3ed" stroke="#6ba58a"/><text x="367" y="364" text-anchor="middle">Repeated denoising</text><text class="small" x="367" y="391" text-anchor="middle">shared network, t = T ... 1</text>
<rect x="265" y="260" width="205" height="43" rx="7" fill="#fff2dc" stroke="#d4b477"/><text class="small" x="367" y="287" text-anchor="middle">Optional text features</text><path class="line" d="M367 303 V325"/>
<path class="line" d="M485 370 H533"/>
<rect class="box" x="540" y="330" width="150" height="80" rx="8"/><text x="615" y="376" text-anchor="middle">Latent z₀</text>
<path class="line" d="M690 370 H738"/>
<rect class="box" x="745" y="330" width="135" height="80" rx="8"/><text x="812" y="376" text-anchor="middle">Decoder D</text>
<path class="line" d="M880 370 H923"/>
<rect class="box" x="930" y="330" width="85" height="80" rx="8"/><text x="972" y="376" text-anchor="middle">Image</text>
<text class="small" x="25" y="460">Fresh text-to-image generation does not require an input image or its encoder pass.</text>
</svg>